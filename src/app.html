<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#111111" />
		<meta name="color-scheme" content="dark" />
		<script>
			// Motion on arrival (see src/lib/motion/reveal.ts): never under reduced motion, on a data
			// saver or a slow connection, or without JavaScript. Content in view on the first load is
			// never hidden; `first-load` gives the hero a CSS-only entrance. If the app has not taken
			// over within 2.5s, everything shows (later pages still animate).
			(function () {
				var root = document.documentElement;
				var net = navigator.connection;
				if (!window.matchMedia || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
				if (net && (net.saveData || /(^|-)2g|3g/.test(net.effectiveType || ''))) return;
				root.classList.add('motion', 'first-load');
				setTimeout(function () {
					if (root.classList.contains('motion-ready')) return;
					root.classList.remove('motion');
					root.setAttribute('data-motion-late', '');
				}, 2500);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
